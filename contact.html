<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Pasidu Daham Senasighe E-Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  

  <header class="navbar" id="navbar">
    <div class="nav-container">
      <nav class="nav-links" id="navLinks" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="skills-work.html" class="nav-link">Skills Work</a>
        <a href="research-project.html" class="nav-link">Research Project</a>
        <a href="oral-presentation.html" class="nav-link">Oral Presentation</a>
        <a href="peer-reviews.html" class="nav-link">Peer Reviews</a>
        <a href="contact.html" class="nav-link active">Contact</a>
      </nav>

      <div class="nav-brand">
        <a href="index.html" class="brand-link">
          <span class="brand-title">E-PORTFOLIO</span>
        </a>
      </div>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </header>

  <main class="page-wrapper">
    <div class="content-container contact-container">
      <div class="page-header-center">
        <span class="page-title-badge">Get in Touch</span>
        <h1 class="page-title">Contact</h1>
      </div>

      <form class="contact-form" id="contactForm" onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label for="contactName" class="form-label">Name *</label>
          <input 
            type="text" 
            id="contactName" 
            name="name" 
            class="form-input" 
            placeholder="Your Name..." 
            required 
          />
        </div>

        <div class="form-group">
          <label for="contactEmail" class="form-label">Email Address *</label>
          <input 
            type="email" 
            id="contactEmail" 
            name="email" 
            class="form-input" 
            placeholder="Your Email Address..." 
            required 
          />
        </div>

        <div class="form-group">
          <label for="contactMessage" class="form-label">Message *</label>
          <textarea 
            id="contactMessage" 
            name="message" 
            rows="6" 
            class="form-textarea" 
            placeholder="Your Message..." 
            required
          ></textarea>
        </div>

        <div class="form-submit-row">
          <button type="submit" class="submit-btn" id="submitBtn">
            <span>Submit</span>
          </button>
        </div>

        <div id="formStatus" class="form-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <button id="backToTopBtn" class="back-to-top-btn" aria-label="Back to top">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
