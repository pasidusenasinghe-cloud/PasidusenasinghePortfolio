<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#e2c290"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle Circular Aura -->
  <circle cx="200" cy="180" r="140" fill="url(#goldAccent)" opacity="0.12"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="200" cy="175" r="90" fill="none" stroke="url(#goldAccent)" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Avatar Head Silhouette & Features -->
  <circle cx="200" cy="175" r="75" fill="#1e293b" stroke="url(#goldAccent)" stroke-width="2"/>
  
  <!-- Stylized Hair -->
  <path d="M 130 160 C 130 90, 270 90, 270 160 C 260 140, 240 120, 200 120 C 160 120, 140 140, 130 160 Z" fill="#0f172a"/>

  <!-- Monogram Initials Inside -->
  <text x="200" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="800" fill="url(#goldAccent)" text-anchor="middle" letter-spacing="1">PS</text>

  <!-- Shoulders & Suit Silhouette -->
  <path d="M 80 430 C 80 300, 320 300, 320 430 Z" fill="url(#suitGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <polygon points="175,320 200,380 225,320" fill="#f8fafc"/>
  <polygon points="195,335 200,395 205,335" fill="url(#goldAccent)"/>

  <!-- Bottom Details -->
  <rect x="0" y="430" width="400" height="70" fill="rgba(7,10,15,0.95)"/>
  <line x1="40" y1="430" x2="360" y2="430" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PASIDU DAHAM SENASIGHE</text>
  <text x="200" y="482" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Business Analytics | RMIT &amp; NCHS</text>
</svg>
